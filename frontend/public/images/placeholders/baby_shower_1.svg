<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="goldBrass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FDF3E1" />
      <stop offset="100%" stop-color="#E4C580" />
    </radialGradient>
    <radialGradient id="blushBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="60%" stop-color="#FBCFE8" />
      <stop offset="100%" stop-color="#F472B6" />
    </radialGradient>
  </defs>

  <!-- Brass Thaalam Outer Rim -->
  <circle cx="300" cy="300" r="280" fill="url(#goldBrass)" stroke="#C8A86B" stroke-width="6" />
  <circle cx="300" cy="300" r="265" fill="none" stroke="#E4C580" stroke-width="2.5" stroke-dasharray="4,4" />

  <!-- Soft Rose-Pink Velvet Lining -->
  <circle cx="300" cy="300" r="250" fill="url(#blushBg)" />

  <!-- Outer Ring: Glass Bangles (Valayal) in Auspicious Green & Red -->
  <g stroke-width="4" fill="none">
    <circle cx="300" cy="85" r="26" stroke="#2F5D3A" />
    <circle cx="415" cy="130" r="26" stroke="#A8232F" />
    <circle cx="495" cy="225" r="26" stroke="#2F5D3A" />
    <circle cx="510" cy="345" r="26" stroke="#A8232F" />
    <circle cx="455" cy="455" r="26" stroke="#2F5D3A" />
    <circle cx="345" cy="510" r="26" stroke="#A8232F" />
    <circle cx="230" cy="500" r="26" stroke="#2F5D3A" />
    <circle cx="135" cy="435" r="26" stroke="#A8232F" />
    <circle cx="85" cy="330" r="26" stroke="#2F5D3A" />
    <circle cx="110" cy="210" r="26" stroke="#A8232F" />
    <circle cx="190" cy="125" r="26" stroke="#2F5D3A" />
  </g>

  <!-- Jasmine (Malli) Flower Garland Ring -->
  <g fill="#FFFDF9" stroke="#E2E8F0" stroke-width="1">
    <circle cx="300" cy="140" r="12" />
    <circle cx="380" cy="175" r="12" />
    <circle cx="430" cy="245" r="12" />
    <circle cx="435" cy="335" r="12" />
    <circle cx="395" cy="415" r="12" />
    <circle cx="320" cy="455" r="12" />
    <circle cx="240" cy="445" r="12" />
    <circle cx="175" cy="390" r="12" />
    <circle cx="160" cy="300" r="12" />
    <circle cx="185" cy="215" r="12" />
    <circle cx="240" cy="160" r="12" />
  </g>

  <!-- Centerpiece: Miniature Floral Cradle (Thottil) -->
  <!-- Cradle Frame in Gold -->
  <path d="M220 250 L380 250" stroke="#B88E3F" stroke-width="4" stroke-linecap="round" />
  <!-- Hanging strings -->
  <line x1="240" y1="250" x2="250" y2="330" stroke="#E4C580" stroke-width="2" />
  <line x1="360" y1="250" x2="350" y2="330" stroke="#E4C580" stroke-width="2" />
  <!-- Cradle Basin -->
  <path d="M245 330 C245 370, 355 370, 355 330 Z" fill="#FDF2F8" stroke="#DB2777" stroke-width="3" />
  <!-- Baby topper pillow -->
  <ellipse cx="300" cy="340" rx="35" ry="16" fill="#F472B6" />
  <!-- Small marigold bloom on top bar -->
  <circle cx="300" cy="250" r="15" fill="#E9A62B" stroke="#D97706" stroke-width="1.5" />
  <circle cx="300" cy="250" r="6" fill="#A8232F" />
</svg>
