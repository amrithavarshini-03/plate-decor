  <!-- Carved Melon Swan & Fruit Mandala in Center -->
  <g fill="#FEF3C7" stroke="#D97706" stroke-width="2">
    <ellipse cx="300" cy="300" rx="75" ry="50" />
    <path d="M 240 300 C 230 260, 280 240, 300 270 C 320 240, 370 260, 360 300 Z" fill="#FDE68A" />
  </g>

  <!-- Sacred Kumkum focal center -->
  <circle cx="300" cy="300" r="16" fill="#A8232F" stroke="#FFFDF9" stroke-width="2" />
  <circle cx="300" cy="300" r="6" fill="#FFFDF9" />
