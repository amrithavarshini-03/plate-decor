  <!-- Ring of Crimson Red Roses -->
  <g fill="#A8232F" stroke="#8A1B25" stroke-width="1">
    <circle cx="455" cy="300" r="16" />
    <circle cx="434" cy="378" r="16" />
    <circle cx="378" cy="434" r="16" />
    <circle cx="300" cy="455" r="16" />
    <circle cx="222" cy="434" r="16" />
    <circle cx="166" cy="378" r="16" />
    <circle cx="145" cy="300" r="16" />
