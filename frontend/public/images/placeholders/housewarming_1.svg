<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="brassPooja" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="70%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <radialGradient id="betelGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </radialGradient>
  </defs>

  <circle cx="300" cy="300" r="280" fill="url(#brassPooja)" stroke="#B45309" stroke-width="6" />
  <circle cx="300" cy="300" r="265" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Betel Leaf Radial Star Pattern -->
  <circle cx="300" cy="300" r="248" fill="url(#betelGreen)" />

  <!-- Auspicious Kalasam / Sacred Coconut in Center -->
  <!-- Brass Pot Base -->
  <path d="M250 360 C240 310, 360 310, 350 360 C340 400, 260 400, 250 360 Z" fill="#F59E0B" stroke="#B45309" stroke-width="3" />
  <!-- Mango leaves tucked around pot rim -->
  <polygon points="270,320 285,270 295,320" fill="#10B981" stroke="#047857" stroke-width="1.5" />
  <polygon points="305,320 315,270 330,320" fill="#10B981" stroke="#047857" stroke-width="1.5" />
  <polygon points="290,320 300,260 310,320" fill="#059669" stroke="#047857" stroke-width="1.5" />
  <!-- Sacred Coconut with Kumkum Tilak -->
  <circle cx="300" cy="275" r="30" fill="#78350F" stroke="#451A03" stroke-width="2" />
  <circle cx="300" cy="275" r="8" fill="#EF4444" />
  <circle cx="300" cy="275" r="3" fill="#FEF3C7" />

  <!-- Surrounding Kamadhenu & Pooja Offerings -->
  <g fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5">
    <circle cx="210" cy="230" r="16" />
    <circle cx="390" cy="230" r="16" />
    <circle cx="200" cy="360" r="16" />
    <circle cx="400" cy="360" r="16" />
  </g>
</svg>
