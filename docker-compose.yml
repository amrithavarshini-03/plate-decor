services:
  postgres:
    image: postgres:16-alpine
    container_name: brb_decors_db
    restart: always
    environment:
      POSTGRES_DB: brb_decors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brb_decors"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brb_decors_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/brb_decors"
      SECRET_KEY: "brb_decors_super_secret_jwt_key_chennai_change_in_production"
      ENVIRONMENT: "production"
      DEBUG: "false"
      ENABLE_PAYMENTS: "false"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brb_decors_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
